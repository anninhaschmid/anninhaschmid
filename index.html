<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema Lagoas - Natal/RN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background: #f4f6f9;
      color: #212529;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .card {
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      border: none;
      transition: background-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
    }
    .card-header {
      font-weight: bold;
      font-size: 1.1rem;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .navbar-brand {
      font-weight: bold;
    }
    input[type="text"],
    select,
    textarea,
    input[type="date"] {
      border-radius: 0.5rem;
      transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }
    .form-control:focus,
    .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13,110,253,.25);
      outline: none;
    }
    .btn {
      border-radius: 0.4rem;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }
    @media (max-width: 768px) {
      .display-6 {
        font-size: 1.5rem;
      }
    }

    /* Modo escuro melhorado */
    body.dark-mode {
      background-color: #121517;
      color: #e4e6eb;
    }
    body.dark-mode .card {
      background-color: #1e242b;
      color: #e4e6eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      border: 1px solid #2f3945;
    }
    body.dark-mode .card-header {
      background-color: #29313d !important;
      color: #f1f3f5 !important;
      border-bottom: 1px solid #3a4553;
    }
    body.dark-mode .navbar-dark {
      background-color: #1a2128 !important;
      box-shadow: 0 1px 5px rgba(0,0,0,0.7);
    }
    body.dark-mode input[type="text"],
    body.dark-mode select,
    body.dark-mode textarea,
    body.dark-mode input[type="date"] {
      background-color: #2a303a;
      color: #e4e6eb;
      border: 1.5px solid #3a4553;
      box-shadow: none;
    }
    body.dark-mode input[type="text"]:focus,
    body.dark-mode select:focus,
    body.dark-mode textarea:focus,
    body.dark-mode input[type="date"]:focus {
      background-color: #343a45;
      border-color: #65a6ff;
      outline: none;
      box-shadow: 0 0 8px 2px rgba(101, 166, 255, 0.5);
      color: #e4e6eb;
    }
    body.dark-mode .btn-primary {
      background-color: #3b7ddd;
      border-color: #3b7ddd;
      color: #f1f3f5;
    }
    body.dark-mode .btn-primary:hover {
      background-color: #346ac9;
      border-color: #346ac9;
    }
    body.dark-mode .btn-success {
      background-color: #239955;
      border-color: #239955;
      color: #f1f3f5;
    }
    body.dark-mode .btn-success:hover {
      background-color: #1f8449;
      border-color: #1f8449;
    }
    body.dark-mode .btn-outline-primary {
      color: #6ca0ff;
      border-color: #6ca0ff;
    }
    body.dark-mode .btn-outline-primary:hover {
      background-color: #6ca0ff;
      color: #121517;
    }
    body.dark-mode .btn-outline-success {
      color: #39b54a;
      border-color: #39b54a;
    }
    body.dark-mode .btn-outline-success:hover {
      background-color: #39b54a;
      color: #121517;
    }
    body.dark-mode .btn-dark {
      background-color: #2a3139;
      border-color: #2a3139;
      color: #e4e6eb;
    }
    body.dark-mode .btn-dark:hover {
      background-color: #21272d;
      border-color: #21272d;
    }
    body.dark-mode .table-light {
      background-color: #2a303a;
      color: #e4e6eb;
      border-color: #3a4553;
    }
    body.dark-mode .table-striped > tbody > tr:nth-of-type(odd) {
      background-color: #232a34;
    }
    body.dark-mode .table-striped > tbody > tr:nth-of-type(even) {
      background-color: #2a303a;
    }
    body.dark-mode .table th,
    body.dark-mode .table td {
      border-color: #3a4553;
    }

    /* Botão de alternância */
    #toggle-theme {
      cursor: pointer;
      font-size: 1.5rem;
      color: #f1c40f;
      transition: color 0.3s ease;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><i class="bi bi-droplet-half me-2"></i>Lagoas Natal</a>
    <button id="toggle-theme" class="btn btn-primary ms-auto" aria-label="Alternar modo escuro/claro" title="Alternar modo escuro/claro">
      <i class="bi bi-moon-fill"></i>
    </button>
  </div>
</nav>

<!-- Container -->
<div class="container my-4">

  <!-- Dashboard -->
  <div class="row mb-4">
    <div class="col-md-6">
      <div class="card text-white bg-info">
        <div class="card-body">
          <h5 class="card-title">Total de Lagoas</h5>
          <p class="card-text display-6">23</p>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card text-white bg-success">
        <div class="card-body">
          <h5 class="card-title">Vistorias Realizadas</h5>
          <p class="card-text display-6">89</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Formulário de Cadastro -->
  <div class="card mb-4">
    <div class="card-header bg-primary text-white"><i class="bi bi-journal-plus me-2"></i>Cadastro de Lagoa</div>
    <div class="card-body">
      <form>
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Nome Oficial</label>
            <input type="text" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Nome Popular</label>
            <input type="text" class="form-control" />
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Bairro</label>
            <input type="text" class="form-control" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Zona Administrativa</label>
            <select class="form-select">
              <option>Oeste</option>
              <option>Sul</option>
              <option>Norte</option>
              <option>Leste</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Bacia de Drenagem</label>
            <input type="text" class="form-control" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Endereço de Referência</label>
          <input type="text" class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Observações</label>
          <textarea class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Salvar</button>
      </form>
    </div>
  </div>

  <!-- Tabela de Lagoas Cadastradas -->
  <div class="card mb-4">
    <div class="card-header bg-secondary text-white"><i class="bi bi-list-ul me-2"></i>Lagoas Cadastradas</div>
    <div class="card-body">
      <input class="form-control mb-3" type="text" placeholder="Buscar por nome ou bairro..." />
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Nome Oficial</th>
              <th>Bairro</th>
              <th>Zona</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>Lagoa do Preá</td>
              <td>Lagoa Nova</td>
              <td>Sul</td>
              <td>
                <button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button>
                <button class="btn btn-sm btn-outline-success"><i class="bi bi-clipboard-check"></i></button>
              </td>
            </tr>
            <!-- Mais linhas aqui -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Vistorias -->
  <div class="card mb-4">
    <div class="card-header bg-dark text-white"><i class="bi bi-clipboard-data me-2"></i>Registrar Vistoria</div>
    <div class="card-body">
      <form>
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Lagoa</label>
            <select class="form-select">
              <option>Lagoa do Preá</option>
              <!-- Mais opções -->
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Data da Vistoria</label>
            <input type="date" class="form-control" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Responsável</label>
          <input type="text" class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Descrição</label>
          <textarea class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Imagem da Vistoria</label>
          <input type="file" class="form-control" />
        </div>
        <button type="submit" class="btn btn-dark"><i class="bi bi-save2"></i> Salvar Vistoria</button>
      </form>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const toggleBtn = document.getElementById('toggle-theme');
  const body = document.body;
  const icon = toggleBtn.querySelector('i');

  toggleBtn.addEventListener('click', () => {
    body.classList.toggle('dark-mode');
    if (body.classList.contains('dark-mode')) {
      icon.classList.remove('bi-moon-fill');
      icon.classList.add('bi-sun-fill');
      toggleBtn.classList.replace('btn-primary', 'btn-warning');
    } else {
      icon.classList.remove('bi-sun-fill');
      icon.classList.add('bi-moon-fill');
      toggleBtn.classList.replace('btn-warning', 'btn-primary');
    }
  });
</script>
</body>
</html>
